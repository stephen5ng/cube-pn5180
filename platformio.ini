; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = v6

[env:v6]
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
lib_deps =
	https://github.com/playfultechnology/PN5180-Library.git#b7fa129c62173b3561bc80ab2a105be02163522d
	mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.10
	adafruit/Adafruit GFX Library@^1.11.9
	knolleary/PubSubClient@^2.8
	; plapointe6/EspMQTTClient@^1.13.3
    ArduinoOTA

monitor_speed = 115200
extra_scripts = pre:scripts/git_version.py
	pre:scripts/patch_pn5180.py
monitor_filters = esp32_exception_decoder
build_type = release

[env:v6_with_hall_analog]
extends = env:v6
build_flags =
	-DHALL_SENSOR_ANALOG

[env:v6_battery]
extends = env:v6
build_flags =
	-DBATTERY_SENSE

; v6 board + 18650 + hall-sensor daughterboard (slots 2-5). Both flags are
; listed explicitly and this extends env:v6, not env:v6_battery: `extends`
; REPLACES build_flags rather than appending to it, so extending the battery env
; and setting build_flags here would silently drop -DBATTERY_SENSE and leave the
; low-battery latch off on a Li-ion cube. env:v6 carries no build_flags, so
; extending it has nothing to lose.
[env:v6_battery_with_hall_analog]
extends = env:v6
build_flags =
	-DHALL_SENSOR_ANALOG
	-DBATTERY_SENSE

; v8.0 board (lexacube_pcb, power board merged on): the hall-sensor board plugs
; into NEIGHBOR-SENSOR and the cell voltage reaches GPIO39, so it needs both.
[env:v8]
extends = env:v6
build_flags =
	-DHALL_SENSOR_ANALOG
	-DBATTERY_SENSE
	-DFW_BOARD=\"v8\"
	; v8 carriers ship beside a v2.3 hall board (DRV5055A2), 4x the counts per
	; mT of the v2.2 boards the presence deltas were calibrated on. NVS
	; overrides this; see cube/device/<mac>/hall_rev.
	-DHALL_DEFAULT_GAIN=4

[env:native]
platform = native
test_framework = unity
build_flags = 
    -std=c++14
    -DNATIVE_TESTING
    -DUNITY_INCLUDE_DOUBLE
    -I test
lib_deps = 
    unity
build_src_filter =
    +<cube_utilities.cpp>
    -<main.cpp>
